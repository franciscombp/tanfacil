<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>No es tan fácil</title>
  </head>
  <body>
    <script>
      var pathSegments = window.location.pathname.split('/').filter(Boolean);
      var lastSegment = pathSegments[pathSegments.length - 1];

      if (lastSegment && lastSegment !== 'tanfacil') {
        window.location.replace('/tanfacil/?route=' + lastSegment);
      } else {
        window.location.replace('/tanfacil/');
      }
    </script>
  </body>
</html>
