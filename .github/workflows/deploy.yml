name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

# Sin esto el push del bot falla con 403 y el despliegue no llega nunca.
permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci || npm install

    - name: Build project
      run: npm run build
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        VITE_ADMIN_TOKEN: ${{ secrets.TAN_FACIL }}

    - name: Commit build if it changed
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -A docs/
        if git diff --cached --quiet; then
          echo "El build no cambió: nada que publicar."
        else
          git commit -m "Build: actualizar docs/ [skip ci]"
          # La rama puede haber avanzado mientras compilaba.
          git pull --rebase origin main
          git push origin HEAD:main
        fi
